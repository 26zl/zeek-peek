[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["main.py"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

# Make Pylance/Pyright match CI: target 3.11 and resolve imports from the local
# .venv (create it with `python3 -m venv .venv && .venv/bin/pip install -r requirements-dev.txt`).
[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
